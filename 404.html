<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Pagina non trovata · Ionix Group</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F4F0E8;color:#1A1815;font-family:'IBM Plex Mono',monospace;
  min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:32px;gap:22px}
.code{font-family:'Bodoni Moda',Georgia,serif;font-size:clamp(72px,16vw,150px);font-weight:500;line-height:1;letter-spacing:-.02em}
.msg{font-family:'Bodoni Moda',Georgia,serif;font-size:clamp(20px,3vw,30px);font-weight:400;font-style:italic}
.sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7A7266;max-width:32ch;line-height:1.7}
a.home{margin-top:10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#1A1815;
  text-decoration:none;border:1px solid #1A1815;padding:14px 24px;transition:background .3s,color .3s}
a.home:hover{background:#1A1815;color:#F4F0E8}
.wm{position:absolute;top:28px;left:28px;font-family:'Bodoni Moda',serif;font-weight:500;font-size:18px;letter-spacing:.14em}
.wm span{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.24em;color:#A24B32;margin-left:8px;vertical-align:1px}
</style>
</head>
<body>
<div class="wm">IONIX<span>GROUP</span></div>
<div class="code">404</div>
<p class="msg">Questa pagina non esiste.</p>
<p class="sub">L'indirizzo potrebbe essere sbagliato o la pagina è stata spostata.</p>
<a class="home" href="/">Torna alla home</a>
</body>
</html>
